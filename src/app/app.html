<header class="topbar">
  <div class="brand">
    <span class="brand__logo" aria-hidden="true">🌍</span>
    <h1 class="brand__name">WeatherScope</h1>
  </div>

  <app-search-bar class="topbar__search" />

  <button
    type="button"
    class="my-world-btn"
    aria-controls="my-world"
    [attr.aria-expanded]="store.myWorldOpen()"
    (click)="store.myWorldOpen.set(!store.myWorldOpen())"
  >
    <span aria-hidden="true">★</span>
    <span class="my-world-btn__label">My World</span>
    @if (store.saved().length) {
      <span class="badge">{{ store.saved().length }}</span>
    }
  </button>

  <button
    type="button"
    class="unit-toggle"
    (click)="store.toggleUnit()"
    [attr.aria-label]="store.unit() === 'celsius' ? 'Switch to Fahrenheit' : 'Switch to Celsius'"
  >
    <span [class.is-active]="store.unit() === 'celsius'">°C</span>
    <span [class.is-active]="store.unit() === 'fahrenheit'">°F</span>
  </button>
</header>

<main class="layout">
  <app-world-map />
  <app-time-slider class="time-slider" />

  @if (store.myWorldOpen()) {
    <app-my-world id="my-world" class="my-world" />
  }

  @if (store.selected(); as place) {
    <app-place-details class="details" [place]="place" />
  }
</main>
