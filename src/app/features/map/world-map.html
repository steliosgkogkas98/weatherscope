<div
  #map
  class="map"
  role="region"
  aria-label="World weather map. Use the arrow keys to pan, plus and minus to zoom, and Tab to move between places."
></div>

<div class="map-status" role="status" aria-live="polite">
  @if (loading()) {
    <span class="chip">Updating weather…</span>
  }
  @if (error(); as message) {
    <span class="chip chip--error">{{ message }}</span>
  }
</div>

<div class="legend" aria-hidden="true">
  @for (stop of legend(); track stop.label) {
    <span class="legend__stop" [style.background]="stop.color">{{ stop.label }}°</span>
  }
</div>
